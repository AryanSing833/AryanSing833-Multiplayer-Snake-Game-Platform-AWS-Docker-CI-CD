name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }} # ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd ~

            # Git setup
            git config --global --add safe.directory '*'
            export GIT_TERMINAL_PROMPT=0

            # Install git if missing
            if ! command -v git &> /dev/null; then
              sudo yum install git -y
            fi

            REPO="AryanSing833-Multiplayer-Snake-Game-Platform-AWS-Docker-CI-CD"
            URL="https://github.com/AryanSing833/${REPO}.git"

            # Clone if first time
            if [ ! -d "$REPO" ]; then
              git clone "$URL"
            fi

            cd "$REPO"

            # Update code
            git fetch --all
            git reset --hard origin/main

            # Install & start Docker if needed
            if ! command -v docker &> /dev/null; then
              sudo yum install docker -y
              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker ec2-user || true
            fi

            # Redeploy container
            sudo docker rm -f snake || true
            sudo docker build --pull -t snake .
            sudo docker run -d -p 80:3000 --name snake snake
