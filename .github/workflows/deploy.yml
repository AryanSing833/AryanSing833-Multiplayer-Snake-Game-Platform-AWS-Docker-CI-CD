name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd ~

            # Git config
            git config --global --add safe.directory '*'
            export GIT_TERMINAL_PROMPT=0

            # Install git if missing
            if ! command -v git &> /dev/null; then
              sudo yum install git -y
            fi

            # Clone only if not exists (WITH TOKEN)
            if [ ! -d "AryanSingh833-Multiplayer-Snake-Game-Platform-AWS-Docker-CI-CD" ]; then
              git clone https://${{ secrets.GH_TOKEN }}@github.com/AryanSingh833/AryanSingh833-Multiplayer-Snake-Game-Platform-AWS-Docker-CI-CD.git
            fi

            cd AryanSingh833-Multiplayer-Snake-Game-Platform-AWS-Docker-CI-CD

            # Pull latest
            git reset --hard
            git pull origin main

            # Install docker if missing
            if ! command -v docker &> /dev/null; then
              sudo yum install docker -y
              sudo systemctl start docker
              sudo systemctl enable docker
            fi

            # Restart container
            sudo docker rm -f snake || true
            sudo docker build --pull -t snake .
            sudo docker run -d -p 80:80 --name snake snake
