name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~

            git config --global --add safe.directory '*'
            sudo yum install git -y

            if [ ! -d "AryanSingh833-Multiplayer-Snake-Game-Platform-AWS-Docker-CI-CD" ]; then
              git clone https://github.com/AryanSingh833/AryanSingh833-Multiplayer-Snake-Game-Platform-AWS-Docker-CI-CD.git
            fi

            cd AryanSingh833-Multiplayer-Snake-Game-Platform-AWS-Docker-CI-CD

            git pull origin main

            sudo docker rm -f snake || true
            sudo docker build -t snake .
            sudo docker run -d -p 80:80 --name snake snake
